<!doctype html>
<meta charset="utf-8">
<title>Chess Utility — Sites</title>
<style>
	:root { color-scheme: light dark; }
	body {
		max-width: 560px; margin: 40px auto; padding: 0 20px;
		font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
		background: #fff; color: #1d1d1f;
	}
	@media (prefers-color-scheme: dark) { body { background: #1e1e20; color: #ececf0; } }
	h1 { font-size: 18px; margin: 0 0 4px; }
	p.lead { margin: 0 0 22px; opacity: .7; }
	h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; opacity: .55; margin: 26px 0 8px; }
	form { display: flex; gap: 8px; }
	input[type=text] {
		flex: 1; font: inherit; padding: 7px 10px; border-radius: 7px;
		border: 1px solid rgba(127,127,127,.45); background: transparent; color: inherit;
	}
	button {
		font: inherit; padding: 7px 14px; border-radius: 7px; cursor: pointer;
		border: 1px solid rgba(127,127,127,.45); background: rgba(127,127,127,.14); color: inherit;
	}
	button:hover { background: rgba(127,127,127,.24); }
	ul { list-style: none; margin: 10px 0 0; padding: 0; }
	li {
		display: flex; align-items: center; justify-content: space-between;
		gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(127,127,127,.18);
	}
	li button { padding: 3px 9px; font-size: 12px; color: #c0504a; }
	.muted { opacity: .6; font-size: 13px; }
	.warn { color: #c0504a; }
	pre {
		margin: 10px 0 0; padding: 10px 12px; border-radius: 7px;
		background: rgba(127,127,127,.12); font-size: 11.5px; line-height: 1.45;
		white-space: pre-wrap; word-break: break-word;
	}
	#msg { margin: 12px 0 0; min-height: 20px; font-size: 13px; }
</style>

<h1>Sites</h1>
<p class="lead">
	Link hints (<code>;</code>) and scrolling (<code>w</code>/<code>s</code>) run on the
	chess sites automatically. Add any other site here — Chrome will ask you to confirm
	it, and you can revoke it at any time.
</p>

<form id="addForm">
	<input type="text" id="host" placeholder="example.com" autocomplete="off" spellcheck="false">
	<button type="submit">Add site</button>
</form>
<p id="msg"></p>

<h2>Enabled</h2>
<ul id="list"></ul>
<p class="muted" id="empty" hidden>No extra sites yet.</p>

<h2>Diagnostics</h2>
<pre id="diag"></pre>

<script src="options.js"></script>
